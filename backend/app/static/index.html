<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EarnWorld Rewards Account</title><style>body{font:16px system-ui;background:#f2f5fa;color:#172033;padding:24px}.wrap{max-width:440px;margin:5vh auto;background:white;padding:26px;border-radius:16px}input,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:9px;border:1px solid #cbd5e1}button{background:#1769e0;color:white;border:0;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5fa;padding:12px}</style></head><body><main class="wrap"><h1>EarnWorld Rewards</h1><p>Development account test page</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (12+ characters to register)"><button id="register">Create test account</button><button id="login">Log in</button><button id="me">Check my account</button><pre id="result">API not tested yet.</pre><p>Test only. Do not reuse a real password. Production launch still needs HTTPS, verified email, recovery, rate limits and security review.</p></main><script>let token='';const out=document.getElementById('result');async function go(path,method='POST'){const body={email:document.getElementById('email').value,password:document.getElementById('password').value};out.textContent='Working…';try{const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(method==='GET'?{}:{body:JSON.stringify(body)})});const d=await r.json();if(d.access_token)token=d.access_token;out.textContent=JSON.stringify(d,null,2)}catch(e){out.textContent='API unavailable: '+e.message}}document.getElementById('register').onclick=()=>go('/auth/register');document.getElementById('login').onclick=()=>go('/auth/login');document.getElementById('me').onclick=()=>go('/auth/me','GET');</script></body></html>
